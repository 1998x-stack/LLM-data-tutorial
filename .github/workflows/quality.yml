name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check generated catalog
        run: python3 scripts/build_course_data.py --check
      - name: Validate site structure and assets
        run: python3 scripts/validate_site.py
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Run offline catalog tests
        run: node --test tests/offline-catalog.test.cjs
      - name: Audit all 28 chapters and assets
        run: python3 scripts/review_repo.py --strict --output review-results/repo-review.json
      - name: Upload repository audit result
        uses: actions/upload-artifact@v4
        with:
          name: full-repository-review
          path: review-results/repo-review.json

  browser-qa:
    name: Browser responsive and interaction review
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test all 28 chapters and homepage at four viewports
        run: python3 scripts/browser_qa.py --out browser-results
      - name: Preserve screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: browser-results/

  public-site-smoke:
    name: Verify published Pages matches main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare public tutorial assets with checked-out source
        run: python3 scripts/verify_deployed_site.py --base-url "https://1998x-stack.github.io/LLM-data-tutorial/"
