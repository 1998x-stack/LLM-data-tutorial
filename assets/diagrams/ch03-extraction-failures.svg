<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="ch03ef-t ch03ef-d">
<title id="ch03ef-t">正文提取的三种结果：漏抽、过抽与平衡</title>
<desc id="ch03ef-d">同一个网页的三个输出：漏抽时只保留部分正文，召回率低；过抽时正文与导航、广告、页脚混在一起，精确率低；平衡时保留标题与正文，去除模板噪声。</desc>
<rect width="1200" height="430" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="600" y="42" text-anchor="middle" font-size="16" fill="#536b75">三个输出对应同一网页；绿色=正确保留的正文，红色=模板噪声，灰色=被丢弃的内容</text>
<g>
<text x="205" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#a34d35">漏抽 · 召回率低</text>
<rect x="90" y="98" width="230" height="290" rx="14" fill="#ffffff" stroke="#e2d3cd"/>
<rect x="106" y="114" width="198" height="34" rx="6" fill="#e6f3ea" stroke="#9fc4ab"/><text x="205" y="136" text-anchor="middle" font-size="12" fill="#2f6b46">标题</text>
<rect x="106" y="158" width="198" height="90" rx="6" fill="#f1f1ef" stroke="#d6d6d2"/><text x="205" y="208" text-anchor="middle" font-size="12" fill="#8a8a83">正文（被漏掉）</text>
<rect x="106" y="258" width="198" height="34" rx="6" fill="#f1f1ef" stroke="#d6d6d2"/><text x="205" y="280" text-anchor="middle" font-size="12" fill="#8a8a83">代码块（被漏掉）</text>
<rect x="106" y="302" width="198" height="34" rx="6" fill="#f1f1ef" stroke="#d6d6d2"/><text x="205" y="324" text-anchor="middle" font-size="12" fill="#8a8a83">表格（被漏掉）</text>
<rect x="106" y="346" width="198" height="28" rx="6" fill="#f8e2dc" stroke="#dfab97"/><text x="205" y="365" text-anchor="middle" font-size="12" fill="#a34d35">页脚仍混入</text>
</g>
<g>
<text x="600" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#a34d35">过抽 · 精确率低</text>
<rect x="485" y="98" width="230" height="290" rx="14" fill="#ffffff" stroke="#e2d3cd"/>
<rect x="501" y="114" width="198" height="26" rx="6" fill="#f8e2dc" stroke="#dfab97"/><text x="600" y="132" text-anchor="middle" font-size="12" fill="#a34d35">导航 / 广告</text>
<rect x="501" y="146" width="198" height="30" rx="6" fill="#e6f3ea" stroke="#9fc4ab"/><text x="600" y="166" text-anchor="middle" font-size="12" fill="#2f6b46">标题</text>
<rect x="501" y="182" width="198" height="96" rx="6" fill="#e6f3ea" stroke="#9fc4ab"/><text x="600" y="234" text-anchor="middle" font-size="12" fill="#2f6b46">正文</text>
<rect x="501" y="284" width="198" height="30" rx="6" fill="#f8e2dc" stroke="#dfab97"/><text x="600" y="304" text-anchor="middle" font-size="12" fill="#a34d35">推荐阅读</text>
<rect x="501" y="320" width="198" height="30" rx="6" fill="#f8e2dc" stroke="#dfab97"/><text x="600" y="340" text-anchor="middle" font-size="12" fill="#a34d35">评论 / 页脚</text>
<rect x="501" y="356" width="198" height="26" rx="6" fill="#f8e2dc" stroke="#dfab97"/><text x="600" y="374" text-anchor="middle" font-size="12" fill="#a34d35">隐私声明</text>
</g>
<g>
<text x="995" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6b46">平衡 · 按标注集评估</text>
<rect x="880" y="98" width="230" height="290" rx="14" fill="#ffffff" stroke="#cfe0d5"/>
<rect x="896" y="114" width="198" height="26" rx="6" fill="#f1f1ef" stroke="#d6d6d2"/><text x="995" y="132" text-anchor="middle" font-size="12" fill="#8a8a83">导航 / 广告（丢弃）</text>
<rect x="896" y="146" width="198" height="30" rx="6" fill="#e6f3ea" stroke="#9fc4ab"/><text x="995" y="166" text-anchor="middle" font-size="12" fill="#2f6b46">标题</text>
<rect x="896" y="182" width="198" height="120" rx="6" fill="#e6f3ea" stroke="#9fc4ab"/><text x="995" y="248" text-anchor="middle" font-size="12" fill="#2f6b46">正文（含代码 / 表格）</text>
<rect x="896" y="308" width="198" height="26" rx="6" fill="#f1f1ef" stroke="#d6d6d2"/><text x="995" y="326" text-anchor="middle" font-size="12" fill="#8a8a83">推荐阅读（丢弃）</text>
<rect x="896" y="340" width="198" height="32" rx="6" fill="#f1f1ef" stroke="#d6d6d2"/><text x="995" y="361" text-anchor="middle" font-size="12" fill="#8a8a83">页脚（丢弃）</text>
</g>
</g></svg>
