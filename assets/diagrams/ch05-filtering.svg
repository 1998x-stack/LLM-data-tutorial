<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">FineWeb 公开的过滤与去重流水线</title><desc id="desc">从 WARC 抽取开始，经过基础过滤、逐 crawl MinHash 去重、选择性 C4 过滤、自定义启发式过滤，最终进行个人信息处理。</desc>
<rect width="1200" height="430" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="38" y="100" width="170" height="125" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="123" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">WARC</text><text x="123" y="169" text-anchor="middle" font-size="17" fill="#203b43">正文抽取</text><text x="123" y="197" text-anchor="middle" font-size="12" fill="#536b75">Trafilatura</text>
<rect x="242" y="100" width="170" height="125" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="327" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">BASE FILTER</text><text x="327" y="169" text-anchor="middle" font-size="17" fill="#203b43">基础过滤</text><text x="327" y="197" text-anchor="middle" font-size="12" fill="#536b75">URL / language / quality</text>
<rect x="446" y="100" width="170" height="125" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="531" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#665b9a">MINHASH</text><text x="531" y="169" text-anchor="middle" font-size="17" fill="#203b43">逐 crawl 去重</text><text x="531" y="197" text-anchor="middle" font-size="12" fill="#536b75">5-gram / 112 hashes</text>
<rect x="650" y="100" width="170" height="125" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="735" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">C4 FILTERS</text><text x="735" y="169" text-anchor="middle" font-size="17" fill="#203b43">选择性规则</text><text x="735" y="197" text-anchor="middle" font-size="12" fill="#536b75">exclude terminal-punct</text>
<rect x="854" y="100" width="170" height="125" rx="14" fill="#fff0e9" stroke="#dfab97"/><text x="939" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#a34d35">CUSTOM</text><text x="939" y="169" text-anchor="middle" font-size="17" fill="#203b43">自定义统计规则</text><text x="939" y="197" text-anchor="middle" font-size="12" fill="#536b75">punct / duplicate / short lines</text>
<rect x="1058" y="100" width="110" height="125" rx="14" fill="#e9f2ed" stroke="#9bb9a7"/><text x="1113" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#416d50">PII</text><text x="1113" y="169" text-anchor="middle" font-size="17" fill="#203b43">处理</text><text x="1113" y="197" text-anchor="middle" font-size="12" fill="#536b75">release</text>
<g stroke="#6d8790" stroke-width="3" fill="none"><path d="M208 162 H232"/><path d="M412 162 H436"/><path d="M616 162 H640"/><path d="M820 162 H844"/><path d="M1024 162 H1048"/></g><g fill="#6d8790"><path d="M225 154 L241 162 L225 170Z"/><path d="M429 154 L445 162 L429 170Z"/><path d="M633 154 L649 162 L633 170Z"/><path d="M837 154 L853 162 L837 170Z"/><path d="M1041 154 L1057 162 L1041 170Z"/></g>
<rect x="150" y="286" width="900" height="82" rx="12" fill="#fff" stroke="#dce5e3"/><text x="600" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#203b43">规则阈值不是普适常数</text><text x="600" y="345" text-anchor="middle" font-size="13" fill="#536b75">论文实验：样本分布 → 候选阈值 → 人工检查 → 数据消融 → 记录适用范围</text>
</g></svg>