<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">URL 过滤与审计流水线</title><desc id="desc">从原始 URL 元数据开始，解析 URI 组件，按 RFC 语义规范化，再应用域名、完整 URL 和弱信号规则，最后分为保留、复核和丢弃，并保存决策原因。</desc>
<rect width="1200" height="390" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="38" y="90" width="170" height="115" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="123" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">URL METADATA</text><text x="123" y="160" text-anchor="middle" font-size="17" fill="#203b43">原始 URL</text><text x="123" y="184" text-anchor="middle" font-size="12" fill="#536b75">source · crawl · id</text>
<rect x="250" y="90" width="170" height="115" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="335" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#665b9a">PARSE</text><text x="335" y="160" text-anchor="middle" font-size="17" fill="#203b43">解析 URI</text><text x="335" y="184" text-anchor="middle" font-size="12" fill="#536b75">scheme / host / path</text>
<rect x="462" y="90" width="170" height="115" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="547" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">NORMALIZE</text><text x="547" y="160" text-anchor="middle" font-size="17" fill="#203b43">规范化</text><text x="547" y="184" text-anchor="middle" font-size="12" fill="#536b75">RFC-aware / versioned</text>
<rect x="674" y="90" width="190" height="115" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="769" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">RULES</text><text x="769" y="160" text-anchor="middle" font-size="17" fill="#203b43">规则检查</text><text x="769" y="184" text-anchor="middle" font-size="12" fill="#536b75">domain / URL / weak signals</text>
<g stroke="#6d8790" stroke-width="3" fill="none"><path d="M208 148 H242"/><path d="M420 148 H454"/><path d="M632 148 H666"/></g><g fill="#6d8790"><path d="M234 140 L250 148 L234 156Z"/><path d="M446 140 L462 148 L446 156Z"/><path d="M658 140 L674 148 L658 156Z"/></g>
<path d="M864 148 H916 V72 H955" stroke="#6d8790" stroke-width="2" fill="none"/><path d="M864 148 H916 V194 H955" stroke="#6d8790" stroke-width="2" fill="none"/><path d="M864 148 H916 V316 H955" stroke="#6d8790" stroke-width="2" fill="none"/>
<rect x="958" y="40" width="198" height="64" rx="12" fill="#e4f3f1" stroke="#86bdb5"/><text x="1057" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#176d6b">KEEP · 保留</text>
<rect x="958" y="162" width="198" height="64" rx="12" fill="#fff4df" stroke="#dfbf7d"/><text x="1057" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="#93641c">REVIEW · 复核</text>
<rect x="958" y="284" width="198" height="64" rx="12" fill="#fff0e9" stroke="#dfab97"/><text x="1057" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#a34d35">DROP · 丢弃</text>
<rect x="250" y="268" width="614" height="74" rx="12" fill="#fff" stroke="#dce5e3"/><text x="557" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#203b43">每个决策都写入审计元数据</text><text x="557" y="323" text-anchor="middle" font-size="12" fill="#536b75">rule_id · policy_version · matched_component · reason · original_url</text>
</g></svg>