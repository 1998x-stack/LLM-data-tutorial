<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Bloom Filter 的单边误判</title><desc id="desc">插入元素时由多个哈希函数设置位数组中的若干位；查询时若任意位为零，元素确定不存在；若全部为一，只能说可能存在，可能出现假阳性。</desc>
<rect width="1200" height="360" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="44" y="82" width="220" height="160" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="154" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">INSERT</text><text x="154" y="155" text-anchor="middle" font-size="17" fill="#203b43">元素 x</text><text x="154" y="185" text-anchor="middle" font-size="13" fill="#536b75">h₁(x), h₂(x), …, hₖ(x)</text><text x="154" y="212" text-anchor="middle" font-size="12" fill="#536b75">把命中的 bit 设为 1</text>
<rect x="330" y="82" width="490" height="160" rx="14" fill="#fff" stroke="#cbd8d5"/><text x="575" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#203b43">BIT ARRAY · m BITS</text>
<g transform="translate(382 148)"><rect x="0" y="0" width="48" height="48" rx="7" fill="#e4f3f1" stroke="#86bdb5"/><rect x="58" y="0" width="48" height="48" rx="7" fill="#e4f3f1" stroke="#86bdb5"/><rect x="116" y="0" width="48" height="48" rx="7" fill="#f2f5f3" stroke="#b9c8c4"/><rect x="174" y="0" width="48" height="48" rx="7" fill="#e4f3f1" stroke="#86bdb5"/><rect x="232" y="0" width="48" height="48" rx="7" fill="#f2f5f3" stroke="#b9c8c4"/><rect x="290" y="0" width="48" height="48" rx="7" fill="#e4f3f1" stroke="#86bdb5"/><rect x="348" y="0" width="48" height="48" rx="7" fill="#f2f5f3" stroke="#b9c8c4"/><g font-size="20" font-weight="700" text-anchor="middle" fill="#176d6b"><text x="24" y="31">1</text><text x="82" y="31">1</text><text x="198" y="31">1</text><text x="314" y="31">1</text></g><g font-size="20" font-weight="700" text-anchor="middle" fill="#839397"><text x="140" y="31">0</text><text x="256" y="31">0</text><text x="372" y="31">0</text></g></g>
<path d="M264 162 H322" stroke="#6d8790" stroke-width="3"/><path d="M314 154 L330 162 L314 170Z" fill="#6d8790"/>
<path d="M820 162 H876 V90 H920" stroke="#6d8790" stroke-width="2" fill="none"/><path d="M820 162 H876 V250 H920" stroke="#6d8790" stroke-width="2" fill="none"/>
<rect x="922" y="54" width="236" height="78" rx="12" fill="#e4f3f1" stroke="#86bdb5"/><text x="1040" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">任一位为 0</text><text x="1040" y="111" text-anchor="middle" font-size="13" fill="#42666a">Definitely not</text>
<rect x="922" y="211" width="236" height="78" rx="12" fill="#fff4df" stroke="#dfbf7d"/><text x="1040" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">全部位为 1</text><text x="1040" y="268" text-anchor="middle" font-size="13" fill="#76551d">Maybe · false positive possible</text>
<text x="600" y="321" text-anchor="middle" font-size="13" fill="#536b75">Bloom Filter 适合做前置筛选；精确删除仍需后端索引核验</text>
</g></svg>