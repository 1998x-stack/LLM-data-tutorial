<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">MinHash 如何估计 Jaccard 相似度</title><desc id="desc">两个文档分别形成 shingle 集合，经过同一随机哈希排列后取各自最小值；并集最小元素落在交集的概率等于 Jaccard 相似度，重复多次得到签名。</desc>
<rect width="1200" height="390" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="40" y="50" font-size="16" font-weight="700" fill="#203b43">SHINGLE SETS</text>
<rect x="40" y="82" width="310" height="104" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="64" y="113" font-size="15" font-weight="700" fill="#284b61">Document A</text><g font-size="13" fill="#284b61"><rect x="64" y="130" width="72" height="34" rx="7" fill="#fff" stroke="#b8cad6"/><text x="100" y="152" text-anchor="middle">s₁</text><rect x="146" y="130" width="72" height="34" rx="7" fill="#fff" stroke="#b8cad6"/><text x="182" y="152" text-anchor="middle">s₂</text><rect x="228" y="130" width="72" height="34" rx="7" fill="#e4f3f1" stroke="#86bdb5"/><text x="264" y="152" text-anchor="middle">s₃</text></g>
<rect x="40" y="205" width="310" height="104" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="64" y="236" font-size="15" font-weight="700" fill="#665b9a">Document B</text><g font-size="13" fill="#514780"><rect x="64" y="253" width="72" height="34" rx="7" fill="#fff" stroke="#c8c0df"/><text x="100" y="275" text-anchor="middle">s₂</text><rect x="146" y="253" width="72" height="34" rx="7" fill="#fff" stroke="#c8c0df"/><text x="182" y="275" text-anchor="middle">s₃</text><rect x="228" y="253" width="72" height="34" rx="7" fill="#fff" stroke="#c8c0df"/><text x="264" y="275" text-anchor="middle">s₄</text></g>
<path d="M350 135 H438 V195 H470" stroke="#6d8790" stroke-width="2.5" fill="none"/><path d="M350 257 H438 V195" stroke="#6d8790" stroke-width="2.5" fill="none"/>
<rect x="472" y="111" width="240" height="168" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="592" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">SAME RANDOM ORDER</text><text x="592" y="180" text-anchor="middle" font-size="13" fill="#76551d">h₁(s), h₂(s), …</text><rect x="514" y="201" width="156" height="42" rx="8" fill="#fff" stroke="#dfbf7d"/><text x="592" y="227" text-anchor="middle" font-size="14" fill="#76551d">take minimum</text>
<path d="M712 195 H790" stroke="#6d8790" stroke-width="3"/><path d="M782 187 L798 195 L782 203Z" fill="#6d8790"/>
<rect x="800" y="111" width="160" height="168" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="880" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">MINHASH</text><text x="880" y="186" text-anchor="middle" font-size="14" fill="#42666a">h(A)</text><text x="880" y="222" text-anchor="middle" font-size="14" fill="#42666a">h(B)</text><text x="880" y="257" text-anchor="middle" font-size="12" fill="#536b75">compare equality</text>
<path d="M960 195 H1010" stroke="#6d8790" stroke-width="3"/><path d="M1002 187 L1018 195 L1002 203Z" fill="#6d8790"/>
<rect x="1020" y="111" width="140" height="168" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="1090" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">REPEAT H</text><text x="1090" y="190" text-anchor="middle" font-size="14" fill="#284b61">signature</text><text x="1090" y="222" text-anchor="middle" font-size="14" fill="#284b61">J estimate</text><text x="1090" y="257" text-anchor="middle" font-size="12" fill="#536b75">match fraction</text>
<text x="600" y="351" text-anchor="middle" font-size="14" fill="#536b75">P[minhash(A) = minhash(B)] = |A ∩ B| / |A ∪ B| = J(A,B)</text>
</g></svg>