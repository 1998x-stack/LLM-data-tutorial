<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">CCNet 的按语言困惑度分层</title>
<desc id="desc">每种语言各自排序段落困惑度，按语言内分位点切成等量的 head、middle、tail 三段；不同语言的绝对困惑度不同，tail 进入抽样审计而不是直接删除。</desc>
<rect width="1200" height="420" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="600" y="42" text-anchor="middle" font-size="15" fill="#536b75">困惑度分层是语言内的相对排名，不是跨语言的绝对阈值</text>
<text x="200" y="86" font-size="12.5" fill="#819196">低 PPL · 更接近目标域</text><text x="1060" y="86" text-anchor="end" font-size="12.5" fill="#819196">高 PPL · 偏离目标域</text>
<g stroke="#c9d6d3" stroke-dasharray="5 5"><path d="M486 96 V276"/><path d="M773 96 V276"/></g>
<text x="486" y="92" text-anchor="middle" font-size="11" fill="#819196">1/3 分位</text><text x="773" y="92" text-anchor="middle" font-size="11" fill="#819196">2/3 分位</text>
<text x="180" y="150" text-anchor="end" font-size="13" font-weight="700" fill="#30434b">英语</text>
<rect x="200" y="120" width="286" height="56" rx="9" fill="#e4f3f1" stroke="#86bdb5"/><rect x="486" y="120" width="287" height="56" rx="9" fill="#fff4df" stroke="#dfbf7d"/><rect x="773" y="120" width="287" height="56" rx="9" fill="#fff0e9" stroke="#dfab97"/>
<text x="343" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#176d6b">HEAD</text><text x="629" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#93641c">MIDDLE</text><text x="916" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#a34d35">TAIL</text>
<text x="180" y="248" text-anchor="end" font-size="13" font-weight="700" fill="#30434b">中文</text>
<rect x="200" y="218" width="286" height="56" rx="9" fill="#e4f3f1" stroke="#86bdb5"/><rect x="486" y="218" width="287" height="56" rx="9" fill="#fff4df" stroke="#dfbf7d"/><rect x="773" y="218" width="287" height="56" rx="9" fill="#fff0e9" stroke="#dfab97"/>
<text x="343" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#176d6b">HEAD</text><text x="629" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#93641c">MIDDLE</text><text x="916" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#a34d35">TAIL</text>
<text x="600" y="304" text-anchor="middle" font-size="12" fill="#536b75">每段等量，但各语言的绝对 PPL 切点不同；按语言分别校准</text>
<rect x="200" y="330" width="287" height="58" rx="10" fill="#f0f7f4" stroke="#86bdb5"/><text x="343" y="355" text-anchor="middle" font-size="12.5" fill="#176d6b">目标域相似度高</text><text x="343" y="375" text-anchor="middle" font-size="11.5" fill="#536b75">作为候选集</text>
<rect x="486" y="330" width="287" height="58" rx="10" fill="#fff6df" stroke="#dfbf7d"/><text x="629" y="355" text-anchor="middle" font-size="12.5" fill="#93641c">结合其他质量信号</text><text x="629" y="375" text-anchor="middle" font-size="11.5" fill="#536b75">采样与复核</text>
<rect x="773" y="330" width="287" height="58" rx="10" fill="#fff0e9" stroke="#dfab97"/><text x="916" y="355" text-anchor="middle" font-size="12.5" fill="#a34d35">抽样审计，不直接删除</text><text x="916" y="375" text-anchor="middle" font-size="11.5" fill="#536b75">口语 / 专业内容仍可能有效</text>
</g></svg>
