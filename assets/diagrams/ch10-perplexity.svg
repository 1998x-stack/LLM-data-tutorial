<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">基于目标域语言模型的困惑度评分流程</title><desc id="desc">文本经过与训练一致的 SentencePiece tokenizer，再由目标域 5-gram Kneser-Ney 模型计算 token 条件概率，聚合平均负对数概率得到交叉熵与困惑度，按语言内分布分层。</desc>
<rect width="1200" height="390" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="38" y="94" width="190" height="122" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="133" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">TEXT</text><text x="133" y="166" text-anchor="middle" font-size="17" fill="#203b43">段落文本</text><text x="133" y="192" text-anchor="middle" font-size="12" fill="#536b75">source language</text>
<rect x="272" y="94" width="190" height="122" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="367" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#665b9a">TOKENIZER</text><text x="367" y="166" text-anchor="middle" font-size="17" fill="#203b43">SentencePiece</text><text x="367" y="192" text-anchor="middle" font-size="12" fill="#536b75">same vocabulary</text>
<rect x="506" y="94" width="190" height="122" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="601" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">N-GRAM LM</text><text x="601" y="166" text-anchor="middle" font-size="17" fill="#203b43">5-gram KN</text><text x="601" y="192" text-anchor="middle" font-size="12" fill="#536b75">target-domain model</text>
<rect x="740" y="94" width="190" height="122" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="835" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">AGGREGATE</text><text x="835" y="166" text-anchor="middle" font-size="17" fill="#203b43">mean NLL → PPL</text><text x="835" y="192" text-anchor="middle" font-size="12" fill="#536b75">per token / paragraph</text>
<g stroke="#6d8790" stroke-width="3" fill="none"><path d="M228 155 H264"/><path d="M462 155 H498"/><path d="M696 155 H732"/></g><g fill="#6d8790"><path d="M256 147 L272 155 L256 163Z"/><path d="M490 147 L506 155 L490 163Z"/><path d="M724 147 L740 155 L724 163Z"/></g>
<path d="M930 155 H972 V88 H1005" stroke="#6d8790" stroke-width="2" fill="none"/><path d="M930 155 H972 V222 H1005" stroke="#6d8790" stroke-width="2" fill="none"/>
<rect x="1007" y="54" width="150" height="68" rx="12" fill="#e4f3f1" stroke="#86bdb5"/><text x="1082" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">LOWER PPL</text><text x="1082" y="104" text-anchor="middle" font-size="12" fill="#42666a">closer to target</text>
<rect x="1007" y="188" width="150" height="68" rx="12" fill="#fff4df" stroke="#dfbf7d"/><text x="1082" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">HIGHER PPL</text><text x="1082" y="238" text-anchor="middle" font-size="12" fill="#76551d">review / other domain</text>
<rect x="270" y="285" width="660" height="62" rx="12" fill="#fff" stroke="#dce5e3"/><text x="600" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#203b43">PPL 是相对于目标 LM 的分布匹配信号</text><text x="600" y="333" text-anchor="middle" font-size="12" fill="#536b75">它不是跨语言、跨 tokenizer、跨领域的通用质量分数</text>
</g></svg>