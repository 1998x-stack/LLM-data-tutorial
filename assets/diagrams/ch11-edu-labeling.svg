<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">FineWeb-Edu 合成标注到学生回归模型</title><desc id="d">抽样网页由 Llama 3 70B 按教育价值 rubric 评分，形成带噪声标签，再训练基于 Snowflake Arctic Embed 的回归模型，对大规模网页输出教育分数，最后按阈值和人工审计决定保留。</desc>
<rect width="1200" height="360" rx="22" fill="#fbfdfb" stroke="#dce5e3"/>
<g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="35" y="100" width="170" height="118" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="120" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">WEB SAMPLE</text><text x="120" y="169" text-anchor="middle" font-size="17" fill="#203b43">网页样本</text><text x="120" y="194" text-anchor="middle" font-size="12" fill="#536b75">抽样 + 分层</text>
<rect x="245" y="100" width="180" height="118" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="335" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#665b9a">TEACHER</text><text x="335" y="169" text-anchor="middle" font-size="17" fill="#203b43">Llama 3 · 70B</text><text x="335" y="194" text-anchor="middle" font-size="12" fill="#536b75">rubric → score 0–5</text>
<rect x="465" y="100" width="180" height="118" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="555" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#93641c">LABEL SET</text><text x="555" y="169" text-anchor="middle" font-size="17" fill="#203b43">合成标签</text><text x="555" y="194" text-anchor="middle" font-size="12" fill="#536b75">score + audit sample</text>
<rect x="685" y="100" width="205" height="118" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="787" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#176d6b">STUDENT</text><text x="787" y="169" text-anchor="middle" font-size="17" fill="#203b43">Embedding + Regressor</text><text x="787" y="194" text-anchor="middle" font-size="12" fill="#536b75">Snowflake Arctic Embed</text>
<rect x="930" y="100" width="230" height="118" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="1045" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">DECISION</text><text x="1045" y="169" text-anchor="middle" font-size="17" fill="#203b43">Score → threshold</text><text x="1045" y="194" text-anchor="middle" font-size="12" fill="#536b75">keep / review / sample</text>
<g stroke="#6d8790" stroke-width="3" fill="none"><path d="M205 159 H237"/><path d="M425 159 H457"/><path d="M645 159 H677"/><path d="M890 159 H922"/></g><g fill="#6d8790"><path d="M229 151 L245 159 L229 167Z"/><path d="M449 151 L465 159 L449 167Z"/><path d="M669 151 L685 159 L669 167Z"/><path d="M914 151 L930 159 L914 167Z"/></g>
<rect x="245" y="263" width="645" height="58" rx="11" fill="#fff" stroke="#dce5e3"/><text x="567" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#203b43">标签不是客观真值：抽样校准、边界样本复核、记录 prompt / model / version</text><text x="567" y="307" text-anchor="middle" font-size="11" fill="#536b75">Teacher bias → label noise → student approximation error → threshold error</text>
</g></svg>