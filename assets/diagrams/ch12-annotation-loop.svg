<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">LLM 辅助数据标注闭环</title><desc id="d">定义任务和 rubric，抽取代表性样本，LLM 按固定版本输出结构化标签，自动校验并按不确定性和分层抽样交给人工复核，裁决后形成版本化标签集用于学生模型训练。</desc>
<rect width="1200" height="360" rx="22" fill="#fbfdfb" stroke="#dce5e3"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<g><rect x="35" y="104" width="170" height="116" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="120" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">DEFINE</text><text x="120" y="173" text-anchor="middle" font-size="16" fill="#203b43">任务 + Rubric</text><text x="120" y="196" text-anchor="middle" font-size="11" fill="#536b75">construct / anchors</text></g>
<g><rect x="245" y="104" width="170" height="116" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="330" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#665b9a">SAMPLE</text><text x="330" y="173" text-anchor="middle" font-size="16" fill="#203b43">分层抽样</text><text x="330" y="196" text-anchor="middle" font-size="11" fill="#536b75">domain / score / length</text></g>
<g><rect x="455" y="104" width="170" height="116" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="540" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#93641c">LABEL</text><text x="540" y="173" text-anchor="middle" font-size="16" fill="#203b43">LLM + JSON</text><text x="540" y="196" text-anchor="middle" font-size="11" fill="#536b75">model / prompt version</text></g>
<g><rect x="665" y="104" width="170" height="116" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="750" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#176d6b">VALIDATE</text><text x="750" y="173" text-anchor="middle" font-size="16" fill="#203b43">规则校验</text><text x="750" y="196" text-anchor="middle" font-size="11" fill="#536b75">schema / evidence / drift</text></g>
<g><rect x="875" y="104" width="170" height="116" rx="14" fill="#fff0e9" stroke="#dfab97"/><text x="960" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#a34d35">HUMAN</text><text x="960" y="173" text-anchor="middle" font-size="16" fill="#203b43">复核与裁决</text><text x="960" y="196" text-anchor="middle" font-size="11" fill="#536b75">borderline / disagreement</text></g>
<g><rect x="1080" y="104" width="90" height="116" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="1125" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#284b61">DATA</text><text x="1125" y="173" text-anchor="middle" font-size="14" fill="#203b43">标签集</text><text x="1125" y="196" text-anchor="middle" font-size="10" fill="#536b75">vN</text></g>
