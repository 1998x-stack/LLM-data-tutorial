<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">LLM 标注偏差的四种审计</title><desc id="d">对同一组样本分别执行位置交换、长度配对、来源盲化和跨模型或人工对照，检查评分差异是否由展示顺序、冗长程度、来源标签或裁判模型偏好造成。</desc>
<rect width="1200" height="340" rx="22" fill="#fbfdfb" stroke="#dce5e3"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="600" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#203b43">BIAS AUDIT MATRIX</text>
<g><rect x="50" y="90" width="245" height="170" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="172" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">POSITION</text><text x="172" y="164" text-anchor="middle" font-size="14" fill="#203b43">A vs B</text><path d="M95 195 H250" stroke="#91abc0" stroke-width="3"/><path d="M250 220 H95" stroke="#91abc0" stroke-width="3"/><text x="172" y="245" text-anchor="middle" font-size="11" fill="#536b75">swap order, compare choice</text></g>
<g><rect x="325" y="90" width="245" height="170" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="447" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#665b9a">VERBOSITY</text><text x="447" y="164" text-anchor="middle" font-size="14" fill="#203b43">same meaning</text><rect x="380" y="188" width="135" height="12" rx="6" fill="#b0a7d3"/><rect x="380" y="210" width="85" height="12" rx="6" fill="#b0a7d3"/><text x="447" y="245" text-anchor="middle" font-size="11" fill="#536b75">match content, vary length</text></g>
<g><rect x="600" y="90" width="245" height="170" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="722" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">SOURCE BLIND</text><text x="722" y="164" text-anchor="middle" font-size="14" fill="#203b43">hide domain / author</text><rect x="660" y="188" width="124" height="35" rx="7" fill="#fff" stroke="#dfbf7d"/><text x="722" y="211" text-anchor="middle" font-size="12" fill="#76551d">anonymous text</text><text x="722" y="245" text-anchor="middle" font-size="11" fill="#536b75">remove prestige cues</text></g>
<g><rect x="875" y="90" width="275" height="170" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="1012" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">REFERENCE</text><text x="1012" y="164" text-anchor="middle" font-size="14" fill="#203b43">human + model panels</text><rect x="930" y="188" width="165" height="35" rx="7" fill="#fff" stroke="#86bdb5"/><text x="1012" y="211" text-anchor="middle" font-size="12" fill="#42666a">agreement / drift</text><text x="1012" y="245" text-anchor="middle" font-size="11" fill="#536b75">calibrate, don't assume truth</text></g>
<text x="600" y="305" text-anchor="middle" font-size="12" fill="#536b75">一致性 ≠ 有效性；稳定地犯同一种错，仍然是错误</text>
</g></svg>