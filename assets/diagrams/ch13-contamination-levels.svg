<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">评测污染的四个机制层级</title><desc id="d">T1 Exact 是逐字或近乎逐字的样本重叠；T2 Syntactic 是经过改写、重排或重新分词的表层变化；T3 Semantic 是无词面重叠但语义等价的内容；T4 Task-Level 是暴露任务格式、推理模式或领域知识而非具体测试样本。</desc>
<rect width="1200" height="360" rx="22" fill="#fbfdfb" stroke="#dce5e3"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<g><rect x="40" y="82" width="255" height="205" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="167" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#176d6b">T1 · EXACT</text><text x="167" y="164" text-anchor="middle" font-size="16" fill="#203b43">逐字 / 近乎逐字</text><rect x="80" y="193" width="175" height="35" rx="7" fill="#fff" stroke="#86bdb5"/><text x="167" y="216" text-anchor="middle" font-size="12" fill="#42666a">verbatim test item</text><text x="167" y="263" text-anchor="middle" font-size="11" fill="#536b75">词面命中较易检测</text></g>
<g><rect x="325" y="82" width="255" height="205" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="452" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#284b61">T2 · SYNTACTIC</text><text x="452" y="164" text-anchor="middle" font-size="16" fill="#203b43">表层形式变化</text><rect x="365" y="193" width="175" height="35" rx="7" fill="#fff" stroke="#91abc0"/><text x="452" y="216" text-anchor="middle" font-size="12" fill="#284b61">paraphrase / reorder</text><text x="452" y="263" text-anchor="middle" font-size="11" fill="#536b75">需要近似检索或归一化</text></g>
<g><rect x="610" y="82" width="255" height="205" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="737" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#93641c">T3 · SEMANTIC</text><text x="737" y="164" text-anchor="middle" font-size="16" fill="#203b43">语义等价</text><rect x="650" y="193" width="175" height="35" rx="7" fill="#fff" stroke="#dfbf7d"/><text x="737" y="216" text-anchor="middle" font-size="12" fill="#76551d">translation / reformulation</text><text x="737" y="263" text-anchor="middle" font-size="11" fill="#536b75">需要语义与上下文判读</text></g>
<g><rect x="895" y="82" width="265" height="205" rx="14" fill="#fff0e9" stroke="#dfab97"/><text x="1027" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#a34d35">T4 · TASK-LEVEL</text><text x="1027" y="164" text-anchor="middle" font-size="16" fill="#203b43">任务机制暴露</text><rect x="940" y="193" width="175" height="35" rx="7" fill="#fff" stroke="#dfab97"/><text x="1027" y="216" text-anchor="middle" font-size="12" fill="#a34d35">format / reasoning pattern</text><text x="1027" y="263" text-anchor="middle" font-size="11" fill="#536b75">最难仅靠字符串审计</text></g>
<text x="600" y="326" text-anchor="middle" font-size="12" fill="#536b75">N-gram、规范化、suffix array 是检测工具；四层 taxonomy 描述的是污染机制</text>
</g></svg>