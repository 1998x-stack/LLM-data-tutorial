<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
<title id="t">训练语料与评测集去污染流水线</title><desc id="d">冻结训练数据清单和评测集版本，统一字段与 tokenizer，进行精确匹配、n-gram 候选检索和近似匹配，保存命中片段供人工审查，再按 clean 与 overlap strata 报告评测差异。</desc>
<rect width="1200" height="350" rx="22" fill="#fbfdfb" stroke="#dce5e3"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="40" y="95" width="180" height="120" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="130" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">FREEZE</text><text x="130" y="164" text-anchor="middle" font-size="16" fill="#203b43">版本清单</text><text x="130" y="190" text-anchor="middle" font-size="11" fill="#536b75">corpus + benchmark</text>
<rect x="270" y="95" width="180" height="120" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="360" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#665b9a">NORMALIZE</text><text x="360" y="164" text-anchor="middle" font-size="16" fill="#203b43">字段 / Tokenizer</text><text x="360" y="190" text-anchor="middle" font-size="11" fill="#536b75">prompt / question / answer</text>
<rect x="500" y="95" width="180" height="120" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="590" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#93641c">RETRIEVE</text><text x="590" y="164" text-anchor="middle" font-size="16" fill="#203b43">精确 + 近似</text><text x="590" y="190" text-anchor="middle" font-size="11" fill="#536b75">hash / n-gram / suffix</text>
<rect x="730" y="95" width="180" height="120" rx="14" fill="#fff0e9" stroke="#dfab97"/><text x="820" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#a34d35">REVIEW</text><text x="820" y="164" text-anchor="middle" font-size="16" fill="#203b43">命中判读</text><text x="820" y="190" text-anchor="middle" font-size="11" fill="#536b75">source / offsets / context</text>
<rect x="960" y="95" width="200" height="120" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="1060" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#176d6b">REPORT</text><text x="1060" y="164" text-anchor="middle" font-size="16" fill="#203b43">Clean / Dirty</text><text x="1060" y="190" text-anchor="middle" font-size="11" fill="#536b75">score delta + caveats</text>
<g stroke="#6d8790" stroke-width="3" fill="none"><path d="M220 155 H262"/><path d="M450 155 H492"/><path d="M680 155 H722"/><path d="M910 155 H952"/></g><g fill="#6d8790"><path d="M254 147 L270 155 L254 163Z"/><path d="M484 147 L500 155 L484 163Z"/><path d="M714 147 L730 155 L714 163Z"/><path d="M944 147 L960 155 L944 163Z"/></g>
<text x="600" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#203b43">每个命中都要保存可复核证据</text><text x="600" y="309" text-anchor="middle" font-size="12" fill="#536b75">benchmark_version · train_manifest · match_type · matched_span · document_id · reviewer_decision</text>
</g></svg>