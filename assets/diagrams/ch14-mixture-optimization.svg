<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
<title id="t">数据混合配比从启发式走向实验优化</title><desc id="d">先定义数据域与 token 预算，再用固定启发式作为基线；DoReMi 用 proxy 和 Group DRO，RegMix 用多组 proxy mixture 回归预测，RegMix-D 利用训练轨迹形成动态混合计划，最终在目标模型上验证。</desc>
<rect width="1200" height="350" rx="22" fill="#fbfdfb" stroke="#dce5e3"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="35" y="110" width="180" height="125" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="125" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">DEFINE</text><text x="125" y="180" text-anchor="middle" font-size="16" fill="#203b43">Domains + Budget</text><text x="125" y="207" text-anchor="middle" font-size="11" fill="#536b75">token share simplex</text>
<rect x="255" y="110" width="180" height="125" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="345" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#93641c">BASELINE</text><text x="345" y="180" text-anchor="middle" font-size="16" fill="#203b43">Heuristic mix</text><text x="345" y="207" text-anchor="middle" font-size="11" fill="#536b75">fixed proportions</text>
<rect x="475" y="65" width="210" height="80" rx="12" fill="#e4f3f1" stroke="#86bdb5"/><text x="580" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#176d6b">DoReMi</text><text x="580" y="122" text-anchor="middle" font-size="11" fill="#42666a">proxy + Group DRO</text>
<rect x="475" y="165" width="210" height="80" rx="12" fill="#f0eef9" stroke="#b0a7d3"/><text x="580" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#665b9a">RegMix / Mixing Laws</text><text x="580" y="222" text-anchor="middle" font-size="11" fill="#514780">proxy experiments → predictor</text>
<rect x="725" y="110" width="205" height="125" rx="14" fill="#fff0e9" stroke="#dfab97"/><text x="827" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#a34d35">RegMix-D</text><text x="827" y="180" text-anchor="middle" font-size="16" fill="#203b43">Dynamic schedule</text><text x="827" y="207" text-anchor="middle" font-size="11" fill="#8b4a37">offline / online</text>
<rect x="970" y="110" width="190" height="125" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="1065" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">VALIDATE</text><text x="1065" y="180" text-anchor="middle" font-size="16" fill="#203b43">Target training</text><text x="1065" y="207" text-anchor="middle" font-size="11" fill="#536b75">held-out downstream suite</text>
<g stroke="#6d8790" stroke-width="2.5" fill="none"><path d="M215 172 H247"/><path d="M435 172 H465"/><path d="M685 105 H715 V172 H717"/><path d="M685 205 H715 V172"/><path d="M930 172 H962"/></g><g fill="#6d8790"><path d="M239 164 L255 172 L239 180Z"/><path d="M707 164 L723 172 L707 180Z"/><path d="M954 164 L970 172 L954 180Z"/></g>
<text x="600" y="294" text-anchor="middle" font-size="12" fill="#536b75">没有脱离模型规模、训练 token budget 和评测目标的“全局最优配比”</text>
</g></svg>