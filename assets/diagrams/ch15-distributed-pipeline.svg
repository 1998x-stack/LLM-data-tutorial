<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">可恢复的大规模数据流水线</title><desc id="d">从不可变输入清单和稳定分片开始，执行局部 map 清洗；只有全局 join、group 或去重才进行 shuffle；结果写入分区化的不可变输出，最后提交 manifest 并校验覆盖率。</desc>
<rect width="1200" height="360" rx="22" fill="#fbfdfb" stroke="#dce5e3"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<rect x="35" y="105" width="180" height="115" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="125" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">MANIFEST</text><text x="125" y="174" text-anchor="middle" font-size="16" fill="#203b43">不可变输入</text><text x="125" y="198" text-anchor="middle" font-size="11" fill="#536b75">snapshot / checksum</text>
<rect x="255" y="105" width="180" height="115" rx="14" fill="#f0eef9" stroke="#b0a7d3"/><text x="345" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#665b9a">PARTITION</text><text x="345" y="174" text-anchor="middle" font-size="16" fill="#203b43">稳定分片</text><text x="345" y="198" text-anchor="middle" font-size="11" fill="#536b75">size / cost / key</text>
<rect x="475" y="105" width="180" height="115" rx="14" fill="#e4f3f1" stroke="#86bdb5"/><text x="565" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#176d6b">MAP STAGES</text><text x="565" y="174" text-anchor="middle" font-size="16" fill="#203b43">抽取 / 清洗</text><text x="565" y="198" text-anchor="middle" font-size="11" fill="#536b75">local transformations</text>
<rect x="695" y="105" width="180" height="115" rx="14" fill="#fff4df" stroke="#dfbf7d"/><text x="785" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#93641c">SHUFFLE</text><text x="785" y="174" text-anchor="middle" font-size="16" fill="#203b43">全局重分布</text><text x="785" y="198" text-anchor="middle" font-size="11" fill="#536b75">join / group / dedup</text>
<rect x="915" y="105" width="250" height="115" rx="14" fill="#e8f0f7" stroke="#91abc0"/><text x="1040" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#284b61">COMMIT</text><text x="1040" y="174" text-anchor="middle" font-size="16" fill="#203b43">不可变输出 + manifest</text><text x="1040" y="198" text-anchor="middle" font-size="11" fill="#536b75">idempotent / auditable</text>
<g stroke="#6d8790" stroke-width="3" fill="none"><path d="M215 162 H247"/><path d="M435 162 H467"/><path d="M655 162 H687"/><path d="M875 162 H907"/></g><g fill="#6d8790"><path d="M239 154 L255 162 L239 170Z"/><path d="M459 154 L475 162 L459 170Z"/><path d="M679 154 L695 162 L679 170Z"/><path d="M899 154 L915 162 L899 170Z"/></g>
<rect x="255" y="270" width="620" height="54" rx="10" fill="#fff" stroke="#dce5e3"/><text x="565" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#203b43">失败重试的最小单位 = 稳定分片，而不是整条全局流水线</text><text x="565" y="312" text-anchor="middle" font-size="11" fill="#536b75">partition_id = hash(input manifest + code version + config + partition key)</text>
</g></svg>