<rect x="45" y="48" width="520" height="250" rx="16" fill="#e8f0f7" stroke="#91abc0"/><text x="305" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#284b61">APACHE SPARK</text>
<g><rect x="90" y="118" width="120" height="52" rx="8" fill="#fff" stroke="#91abc0"/><text x="150" y="150" text-anchor="middle" font-size="13" fill="#284b61">Partition 1</text><rect x="235" y="118" width="120" height="52" rx="8" fill="#fff" stroke="#91abc0"/><text x="295" y="150" text-anchor="middle" font-size="13" fill="#284b61">Partition 2</text><rect x="380" y="118" width="120" height="52" rx="8" fill="#fff" stroke="#91abc0"/><text x="440" y="150" text-anchor="middle" font-size="13" fill="#284b61">Partition 3</text><path d="M150 170 V205 H295 M295 170 V205 M440 170 V205 H295" stroke="#284b61" stroke-width="2" fill="none"/><rect x="225" y="207" width="140" height="42" rx="8" fill="#fff" stroke="#91abc0"/><text x="295" y="233" text-anchor="middle" font-size="13" fill="#284b61">Shuffle / Stage</text></g><text x="305" y="278" text-anchor="middle" font-size="11" fill="#536b75">DAG · lazy transforms · AQE · lineage</text>
<rect x="635" y="48" width="520" height="250" rx="16" fill="#e4f3f1" stroke="#86bdb5"/><text x="895" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#176d6b">RAY DATA</text>
<g><rect x="680" y="118" width="95" height="52" rx="8" fill="#fff" stroke="#86bdb5"/><text x="727" y="150" text-anchor="middle" font-size="13" fill="#176d6b">Block A</text><rect x="805" y="118" width="95" height="52" rx="8" fill="#fff" stroke="#86bdb5"/><text x="852" y="150" text-anchor="middle" font-size="13" fill="#176d6b">Block B</text><rect x="930" y="118" width="95" height="52" rx="8" fill="#fff" stroke="#86bdb5"/><text x="977" y="150" text-anchor="middle" font-size="13" fill="#176d6b">Block C</text><path d="M727 170 V205 H852 M852 170 V205 M977 170 V205 H852" stroke="#176d6b" stroke-width="2" fill="none"/><rect x="782" y="207" width="140" height="42" rx="8" fill="#fff" stroke="#86bdb5"/><text x="852" y="233" text-anchor="middle" font-size="13" fill="#176d6b">Streaming Op</text><path d="M922 228 H1040" stroke="#c65e42" stroke-width="2" stroke-dasharray="5 4"/><text x="1080" y="232" font-size="11" fill="#a34d35">pressure</text></g><text x="895" y="278" text-anchor="middle" font-size="11" fill="#42666a">blocks · tasks / actors · object store · backpressure</text>
