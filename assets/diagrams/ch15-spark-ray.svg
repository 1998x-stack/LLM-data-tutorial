<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
<title id="t">Spark 与 Ray Data 的执行模型</title><desc id="d">Spark 以分区和 stage 为执行单元，Shuffle 通过网络重新分配键；Ray Data 以 blocks 和 streaming operators 连接 task 或 actor，利用 backpressure 控制上游生产。两者都需要容量估计、监控和可恢复输出。</desc>
