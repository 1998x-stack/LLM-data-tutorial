<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">LLM 语料五层存储架构</title><desc id="d">从不可变原始 WARC 和来源清单，进入规范化 Parquet 数据湖、质量筛选 snapshot、训练 shards，最后形成绑定 tokenizer revision 的 token blocks。</desc><rect width="1200" height="390" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="54" y="52" font-size="16" font-weight="700" fill="#56716c">DATA LIFECYCLE · IMMUTABLE INPUT → DERIVED VIEWS</text>
