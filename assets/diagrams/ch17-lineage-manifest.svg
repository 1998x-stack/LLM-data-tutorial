<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">数据流水线的 run manifest 身份结构</title><desc id="d">Source snapshot、code commit、canonical config、runtime lock、model and tokenizer revisions 和 random seed 汇聚到一个 run identity，再生成带 checksum 和 schema 的输出 shards 与最终 dataset root digest。</desc><rect width="1200" height="430" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">RUN MANIFEST · INPUT IDENTITY → OUTPUT PROVENANCE</text><g><rect x="45" y="85" width="340" height="68" rx="10" fill="#e5f2ee" stroke="#94bdb1"/><text x="62" y="112" font-size="12" font-weight="800" fill="#2c5656">SOURCE</text><text x="62" y="137" font-size="12" fill="#526e70">snapshot + object checksums</text></g><g><rect x="415" y="85" width="340" height="68" rx="10" fill="#e8f0f7" stroke="#9bb8cd"/><text x="432" y="112" font-size="12" font-weight="800" fill="#2c5656">CODE</text><text x="432" y="137" font-size="12" fill="#526e70">git commit + container digest</text></g><g><rect x="785" y="85" width="340" height="68" rx="10" fill="#e5f2ee" stroke="#94bdb1"/><text x="802" y="112" font-size="12" font-weight="800" fill="#2c5656">CONFIG</text><text x="802" y="137" font-size="12" fill="#526e70">canonical JSON + hash</text></g><g><rect x="45" y="177" width="340" height="68" rx="10" fill="#e8f0f7" stroke="#9bb8cd"/><text x="62" y="204" font-size="12" font-weight="800" fill="#2c5656">RUNTIME</text><text x="62" y="229" font-size="12" fill="#526e70">lockfile + library versions</text></g><g><rect x="415" y="177" width="340" height="68" rx="10" fill="#e5f2ee" stroke="#94bdb1"/><text x="432" y="204" font-size="12" font-weight="800" fill="#2c5656">TOKENIZER</text><text x="432" y="229" font-size="12" fill="#526e70">model / tokenizer revision</text></g><g><rect x="785" y="177" width="340" height="68" rx="10" fill="#e8f0f7" stroke="#9bb8cd"/><text x="802" y="204" font-size="12" font-weight="800" fill="#2c5656">RANDOM</text><text x="802" y="229" font-size="12" fill="#526e70">seed + sampling algorithm</text></g><path d="M215 246v24h770v-24M585 246v24M955 246v24" fill="none" stroke="#71938a" stroke-width="2"/><rect x="340" y="282" width="520" height="55" rx="12" fill="#203f49"/><text x="600" y="315" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">RUN IDENTITY · canonical manifest digest</text><path d="M600 337v28" stroke="#71938a" stroke-width="2.5"/><path d="M590 356l10 10 10-10" fill="none" stroke="#71938a" stroke-width="2.5"/><rect x="200" y="371" width="800" height="42" rx="9" fill="#fff1dc" stroke="#e2c58f"/><text x="600" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#735b2f">OUTPUT SHARDS · checksum · schema · rows · final dataset root</text></g></svg>