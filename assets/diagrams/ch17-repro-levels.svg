<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">可复现性的三个等级</title><desc id="d">Bitwise reproduction 要求输出字节和 checksum 完全相同；semantic reproduction 要求样本和字段含义一致；statistical reproduction 要求关键分布和下游指标在预设容差内。</desc><rect width="1200" height="390" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="50" y="48" font-size="16" font-weight="700" fill="#56716c">REPRODUCIBILITY CONTRACT · DEFINE THE EQUIVALENCE RELATION</text><g><rect x="48" y="95" width="330" height="210" rx="14" fill="#e4f3f0" stroke="#8bbdb2" stroke-width="1.5"/><text x="213" y="137" text-anchor="middle" font-size="14" font-weight="800" fill="#24464b">BITWISE</text><text x="213" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#24464b">字节级一致</text><text x="213" y="218" text-anchor="middle" font-size="12" fill="#42636a">SHA-256 / byte equality</text><text x="213" y="253" text-anchor="middle" font-size="11" fill="#5a7777">相同输入与环境 → 相同文件</text></g><g><rect x="426" y="113" width="330" height="174" rx="14" fill="#e9f0f7" stroke="#9bb8cd" stroke-width="1.5"/><text x="591" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#24464b">SEMANTIC</text><text x="591" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#24464b">语义级一致</text><text x="591" y="236" text-anchor="middle" font-size="12" fill="#42636a">same records / schema</text><text x="591" y="271" text-anchor="middle" font-size="11" fill="#5a7777">顺序或物理布局可不同</text></g><g><rect x="804" y="131" width="330" height="138" rx="14" fill="#fff2df" stroke="#e2bf7f" stroke-width="1.5"/><text x="969" y="173" text-anchor="middle" font-size="14" font-weight="800" fill="#24464b">STATISTICAL</text><text x="969" y="217" text-anchor="middle" font-size="20" font-weight="700" fill="#24464b">统计级一致</text><text x="969" y="254" text-anchor="middle" font-size="12" fill="#42636a">distribution / metric tolerance</text><text x="969" y="289" text-anchor="middle" font-size="11" fill="#5a7777">允许随机性，但必须报告误差</text></g><path d="M100 337h1000" stroke="#b7c9c2" stroke-width="2"/><text x="600" y="366" text-anchor="middle" font-size="12" fill="#647b78">不是每个训练步骤都能保证 bitwise deterministic；先声明目标，再选择可验证门禁</text></g></svg>