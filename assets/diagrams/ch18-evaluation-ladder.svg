<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">数据质量评估证据阶梯</title><desc id="d">从成本较低的 schema 和完整性门禁，经过统计分布代理、分层人工审计，最终到固定模型训练配方和多任务下游评测；越靠上成本越高但越接近目标效用。</desc><rect width="1200" height="390" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">EVIDENCE LADDER · LOW COST SIGNALS → DOWNSTREAM UTILITY</text><g><rect x="50" y="100" width="240" height="205" rx="13" fill="#e4f3f0" stroke="#8bbdb2" stroke-width="1.5"/><text x="170" y="140" text-anchor="middle" font-size="12" font-weight="800" fill="#31565b">01 · STRUCTURAL GATES</text><text x="170" y="185" text-anchor="middle" font-size="12" fill="#365e63">schema · decode · null · checksum</text><text x="170" y="230" text-anchor="middle" font-size="11" fill="#637d79">cheap / deterministic</text></g><g><rect x="330" y="95" width="240" height="215" rx="13" fill="#e9f0f7" stroke="#9bb8cd" stroke-width="1.5"/><text x="450" y="135" text-anchor="middle" font-size="12" font-weight="800" fill="#31565b">02 · DISTRIBUTION AUDIT</text><text x="450" y="190" text-anchor="middle" font-size="12" fill="#365e63">language · domain · length · duplicates</text><text x="450" y="238" text-anchor="middle" font-size="11" fill="#637d79">cheap / broad coverage</text></g><g><rect x="610" y="90" width="240" height="225" rx="13" fill="#fff2df" stroke="#e2bf7f" stroke-width="1.5"/><text x="730" y="130" text-anchor="middle" font-size="12" font-weight="800" fill="#31565b">03 · HUMAN REVIEW</text><text x="730" y="195" text-anchor="middle" font-size="12" fill="#365e63">stratified sample · rubric · adjudication</text><text x="730" y="246" text-anchor="middle" font-size="11" fill="#637d79">costly / interpretable</text></g><g><rect x="890" y="85" width="240" height="235" rx="13" fill="#fcece7" stroke="#e3b09e" stroke-width="1.5"/><text x="1010" y="125" text-anchor="middle" font-size="12" font-weight="800" fill="#31565b">04 · CONTROLLED TRAINING</text><text x="1010" y="200" text-anchor="middle" font-size="12" fill="#365e63">fixed recipe · tokens · multi-task eval</text><text x="1010" y="254" text-anchor="middle" font-size="11" fill="#637d79">expensive / task-grounded</text></g><path d="M1050 327h95m-8-8 8 8-8 8" fill="none" stroke="#64817b" stroke-width="2"/><text x="600" y="363" text-anchor="middle" font-size="12" fill="#647b78">低成本代理适合筛查；最终训练价值需要受控对照与切片评测</text></g></svg>