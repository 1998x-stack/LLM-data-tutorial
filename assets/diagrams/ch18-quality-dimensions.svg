<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">训练语料质量的六个独立维度</title><desc id="d">质量评估至少拆分内容可靠性、覆盖多样性、结构完整性、冗余与污染、安全与治理以及下游效用；各维度需要分别报告，不应无条件合并为单一总分。</desc><rect width="1200" height="420" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">QUALITY IS FITNESS FOR PURPOSE · NOT ONE UNIVERSAL SCORE</text><g><rect x="48" y="90" width="345" height="112" rx="13" fill="#e4f3f0" stroke="#8bbdb2" stroke-width="1.5"/><circle cx="82" cy="125" r="19" fill="#fff" stroke="#8bbdb2"/><text x="82" y="130" text-anchor="middle" font-size="11" font-weight="800" fill="#34575b">01</text><text x="116" y="130" font-size="16" font-weight="800" fill="#25494c">内容可靠性</text><text x="70" y="171" font-size="12" fill="#536e70">事实核验 · 噪声 · 可读性</text></g><g><rect x="423" y="90" width="345" height="112" rx="13" fill="#e9f0f7" stroke="#9bb8cd" stroke-width="1.5"/><circle cx="457" cy="125" r="19" fill="#fff" stroke="#9bb8cd"/><text x="457" y="130" text-anchor="middle" font-size="11" font-weight="800" fill="#34575b">02</text><text x="491" y="130" font-size="16" font-weight="800" fill="#25494c">覆盖与多样性</text><text x="445" y="171" font-size="12" fill="#536e70">语言 · 领域 · 时间 · 来源</text></g><g><rect x="798" y="90" width="345" height="112" rx="13" fill="#f4eafa" stroke="#c5a6d8" stroke-width="1.5"/><circle cx="832" cy="125" r="19" fill="#fff" stroke="#c5a6d8"/><text x="832" y="130" text-anchor="middle" font-size="11" font-weight="800" fill="#34575b">03</text><text x="866" y="130" font-size="16" font-weight="800" fill="#25494c">结构完整性</text><text x="820" y="171" font-size="12" fill="#536e70">Schema · 解码 · 截断 · 空值</text></g><g><rect x="48" y="232" width="345" height="112" rx="13" fill="#fff2df" stroke="#e2bf7f" stroke-width="1.5"/><circle cx="82" cy="267" r="19" fill="#fff" stroke="#e2bf7f"/><text x="82" y="272" text-anchor="middle" font-size="11" font-weight="800" fill="#34575b">04</text><text x="116" y="272" font-size="16" font-weight="800" fill="#25494c">冗余与污染</text><text x="70" y="313" font-size="12" fill="#536e70">Exact / fuzzy duplicates · leakage</text></g><g><rect x="423" y="232" width="345" height="112" rx="13" fill="#fcece7" stroke="#e3b09e" stroke-width="1.5"/><circle cx="457" cy="267" r="19" fill="#fff" stroke="#e3b09e"/><text x="457" y="272" text-anchor="middle" font-size="11" font-weight="800" fill="#34575b">05</text><text x="491" y="272" font-size="16" font-weight="800" fill="#25494c">安全与治理</text><text x="445" y="313" font-size="12" fill="#536e70">PII · license · source · retention</text></g><g><rect x="798" y="232" width="345" height="112" rx="13" fill="#e8f0f7" stroke="#9bb8cd" stroke-width="1.5"/><circle cx="832" cy="267" r="19" fill="#fff" stroke="#9bb8cd"/><text x="832" y="272" text-anchor="middle" font-size="11" font-weight="800" fill="#34575b">06</text><text x="866" y="272" font-size="16" font-weight="800" fill="#25494c">下游效用</text><text x="820" y="313" font-size="12" fill="#536e70">Controlled training · eval slices</text></g><text x="600" y="395" text-anchor="middle" font-size="12" fill="#647b78">治理硬门禁不可由其他维度高分抵消；proxy 指标必须用人工与下游证据校准</text></g></svg>