<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">BPE 相邻符号合并过程</title><desc id="d">示意单词 lowest 从字符 l o w e s t 和词尾标记开始，先合并高频的 l o 为 lo，再合并 lo w 为 low，后续继续合并常见片段。</desc><rect width="1200" height="430" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">BPE TRAINING · RECOUNT AFTER EVERY MERGE</text><text x="70" y="105" font-size="13" font-weight="700" fill="#42636a">INITIAL SYMBOLS</text><g><rect x="70" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="104" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">l</text></g><g><rect x="160" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="194" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">o</text></g><g><rect x="250" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="284" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">w</text></g><g><rect x="340" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="374" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">e</text></g><g><rect x="430" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="464" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">s</text></g><g><rect x="520" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="554" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">t</text></g><g><rect x="610" y="125" width="68" height="55" rx="9" fill="#e9f0f7" stroke="#9bb8cd"/><text x="644" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#284b61">&lt;/w&gt;</text></g><path d="M390 202v28h190v-28" fill="none" stroke="#7d9d95" stroke-width="2"/><text x="485" y="255" text-anchor="middle" font-size="12" fill="#56716c">merge rank 1</text><rect x="70" y="280" width="150" height="62" rx="10" fill="#e4f3f0" stroke="#8bbdb2"/><text x="145" y="318" text-anchor="middle" font-size="22" font-weight="800" fill="#28564f">lo</text><text x="242" y="318" font-size="16" fill="#56716c">+</text><rect x="275" y="280" width="100" height="62" rx="10" fill="#e9f0f7" stroke="#9bb8cd"/><text x="325" y="318" text-anchor="middle" font-size="22" font-weight="800" fill="#284b61">w</text><text x="396" y="318" font-size="16" fill="#56716c">→</text><rect x="435" y="280" width="150" height="62" rx="10" fill="#fff2df" stroke="#e2bf7f"/><text x="510" y="318" text-anchor="middle" font-size="22" font-weight="800" fill="#805c22">low</text><text x="650" y="301" font-size="13" fill="#42636a">后续 merge 会依赖</text><text x="650" y="326" font-size="13" fill="#42636a">当前已合并的符号表</text><text x="600" y="390" text-anchor="middle" font-size="12" fill="#647b78">示意图只展示合并机制；真实 merge 次序由完整训练语料的 pair 频次决定</text></g></svg>