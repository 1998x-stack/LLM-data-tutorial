<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Tokenizer 的处理流水线</title><desc id="d">文本从 Unicode 字符串开始，经过 normalizer 与 pre-tokenizer，转换为 byte 或字符基础单元，按 merge ranks 合并为 subword tokens，映射到 token IDs，再进入 embedding。</desc><rect width="1200" height="390" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">TEXT → SUBWORDS → IDS → EMBEDDINGS</text><g><rect x="28" y="130" width="145" height="126" rx="12" fill="#e4f3f0" stroke="#8bbdb2"/><text x="100" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">TEXT</text><text x="100" y="205" text-anchor="middle" font-size="11" fill="#557174">Unicode string</text></g><path d="M175 193h14m-6-6 6 6-6 6" stroke="#6f9189" stroke-width="2" fill="none" stroke-linecap="round"/><g><rect x="193" y="130" width="145" height="126" rx="12" fill="#e9f0f7" stroke="#9bb8cd"/><text x="265" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">NORMALIZE</text><text x="265" y="205" text-anchor="middle" font-size="11" fill="#557174">normalizer</text></g><path d="M175 193h14m-6-6 6 6-6 6" stroke="#6f9189" stroke-width="2" fill="none" stroke-linecap="round"/><g><rect x="358" y="130" width="145" height="126" rx="12" fill="#e4f3f0" stroke="#8bbdb2"/><text x="430" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">PRE-TOKENIZE</text><text x="430" y="205" text-anchor="middle" font-size="11" fill="#557174">regex / boundary</text></g><path d="M175 193h14m-6-6 6 6-6 6" stroke="#6f9189" stroke-width="2" fill="none" stroke-linecap="round"/><g><rect x="523" y="130" width="145" height="126" rx="12" fill="#e9f0f7" stroke="#9bb8cd"/><text x="595" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">BASE UNITS</text><text x="595" y="205" text-anchor="middle" font-size="11" fill="#557174">bytes / chars</text></g><path d="M175 193h14m-6-6 6 6-6 6" stroke="#6f9189" stroke-width="2" fill="none" stroke-linecap="round"/><g><rect x="688" y="130" width="145" height="126" rx="12" fill="#e4f3f0" stroke="#8bbdb2"/><text x="760" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">MERGE</text><text x="760" y="205" text-anchor="middle" font-size="11" fill="#557174">BPE ranks</text></g><path d="M175 193h14m-6-6 6 6-6 6" stroke="#6f9189" stroke-width="2" fill="none" stroke-linecap="round"/><g><rect x="853" y="130" width="145" height="126" rx="12" fill="#e9f0f7" stroke="#9bb8cd"/><text x="925" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">ID MAP</text><text x="925" y="205" text-anchor="middle" font-size="11" fill="#557174">token → integer</text></g><path d="M175 193h14m-6-6 6 6-6 6" stroke="#6f9189" stroke-width="2" fill="none" stroke-linecap="round"/><g><rect x="1018" y="130" width="145" height="126" rx="12" fill="#e4f3f0" stroke="#8bbdb2"/><text x="1090" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#28535a">MODEL</text><text x="1090" y="205" text-anchor="middle" font-size="11" fill="#557174">embedding</text></g><text x="600" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#31565b">Tokenizer behavior = normalization + pre-tokenization + base alphabet + merge / score model + special-token rules</text><text x="600" y="344" text-anchor="middle" font-size="12" fill="#647b78">改变任一组件或 revision，都可能改变 token IDs 与序列长度</text></g></svg>