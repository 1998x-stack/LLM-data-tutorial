<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">多语言 tokenizer fertility 对比示意</title><desc id="d">相同语义内容的平行文本可能被同一个 tokenizer 切成不同数量的 token；英语、中文、日语和低资源语言的 token cost 应使用平行语料逐一测量。</desc><rect width="1200" height="420" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">PARALLEL CONTENT · TOKEN COST IS LANGUAGE-DEPENDENT</text><g><rect x="50" y="100" width="250" height="205" rx="13" fill="#e4f3f0" stroke="#8bbdb2"/><text x="175" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#31565b">EN</text><text x="175" y="190" text-anchor="middle" font-size="17" fill="#2d4e53">The model reads text.</text><rect x="95" y="225" width="160" height="38" rx="7" fill="#fff" stroke="#8bbdb2"/><text x="175" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#42636a">4 tokens · illustrative</text></g><g><rect x="335" y="100" width="250" height="205" rx="13" fill="#e9f0f7" stroke="#9bb8cd"/><text x="460" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#31565b">ZH</text><text x="460" y="190" text-anchor="middle" font-size="17" fill="#2d4e53">模型读取文本。</text><rect x="380" y="225" width="160" height="38" rx="7" fill="#fff" stroke="#9bb8cd"/><text x="460" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#42636a">5 tokens · illustrative</text></g><g><rect x="620" y="100" width="250" height="205" rx="13" fill="#fff2df" stroke="#e2bf7f"/><text x="745" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#31565b">JA</text><text x="745" y="190" text-anchor="middle" font-size="17" fill="#2d4e53">モデルが文章を読む。</text><rect x="665" y="225" width="160" height="38" rx="7" fill="#fff" stroke="#e2bf7f"/><text x="745" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#42636a">7 tokens · illustrative</text></g><g><rect x="905" y="100" width="250" height="205" rx="13" fill="#fcece7" stroke="#e3b09e"/><text x="1030" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#31565b">LOW-RESOURCE</text><text x="1030" y="190" text-anchor="middle" font-size="17" fill="#2d4e53">equivalent sentence</text><rect x="950" y="225" width="160" height="38" rx="7" fill="#fff" stroke="#e3b09e"/><text x="1030" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#42636a">9 tokens · illustrative</text></g><text x="600" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#31565b">示意数字不是任何真实 tokenizer 的 benchmark</text><text x="600" y="380" text-anchor="middle" font-size="12" fill="#647b78">真实比较需平行文本、相同 normalization、明确 word / byte 口径与 tokenizer revision</text></g></svg>