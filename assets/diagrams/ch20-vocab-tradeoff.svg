<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">词表大小的双向成本权衡</title><desc id="d">词表增大可能降低固定文本的 token 序列长度，但同时扩大输入 embedding 和输出 LM head 参数量、logits 维度与稀有 token 的学习压力。</desc><rect width="1200" height="420" rx="22" fill="#f8fbf9" stroke="#dce7e2"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif"><text x="48" y="48" font-size="16" font-weight="700" fill="#56716c">VOCABULARY SIZE · COMPRESSION IS NOT FREE</text><rect x="425" y="84" width="350" height="65" rx="13" fill="#203f49"/><text x="600" y="124" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Vocabulary size V ↑</text><path d="M505 149L280 218M695 149l225 69" fill="none" stroke="#78958d" stroke-width="3"/><path d="M270 207l10 11-15 2M930 207l-10 11 15 2" fill="none" stroke="#78958d" stroke-width="3"/><rect x="55" y="235" width="470" height="112" rx="14" fill="#e4f3f0" stroke="#8bbdb2"/><text x="290" y="275" text-anchor="middle" font-size="16" font-weight="800" fill="#28564f">POTENTIAL BENEFIT</text><text x="290" y="310" text-anchor="middle" font-size="14" fill="#42636a">tokens per text ↓ · sequence length ↓</text><rect x="675" y="235" width="470" height="112" rx="14" fill="#fff2df" stroke="#e2bf7f"/><text x="910" y="275" text-anchor="middle" font-size="16" font-weight="800" fill="#805c22">ADDED COST</text><text x="910" y="310" text-anchor="middle" font-size="14" fill="#6e5a37">V × d parameters · logits width · rare-token sparsity</text><text x="600" y="385" text-anchor="middle" font-size="12" fill="#647b78">选择 V 必须同时测量压缩、模型参数、吞吐、多语言公平性与下游任务表现</text></g></svg>