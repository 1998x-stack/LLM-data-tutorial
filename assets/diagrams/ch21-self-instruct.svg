<rect x="665" y="125" width="220" height="100" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="775" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">LLM generation</text><text x="775" y="187" text-anchor="middle" font-size="13" fill="#536b75">Instruction · Input · Output</text>
<rect x="970" y="125" width="175" height="100" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="1057.5" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Filter</text><text x="1057.5" y="187" text-anchor="middle" font-size="13" fill="#536b75">Invalid · Similar</text>
