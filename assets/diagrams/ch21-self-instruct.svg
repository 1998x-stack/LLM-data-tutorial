<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s21seed-title s21seed-desc"><title id="s21seed-title">Self-Instruct 任务扩展</title><desc id="s21seed-desc">少量人工种子任务被抽样为上下文示例，模型生成新指令与实例，随后进行格式、有效性和相似度过滤。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">SEED TASKS → NEW INSTRUCTIONS → FILTERED TASK POOL</text>
<rect x="55" y="125" width="220" height="100" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="165" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Seed task pool</text><text x="165" y="187" text-anchor="middle" font-size="13" fill="#536b75">人工编写 · 少量高质量</text>
