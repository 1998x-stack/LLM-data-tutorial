<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s21verify-title s21verify-desc"><title id="s21verify-title">合成样本多路验证</title><desc id="s21verify-desc">同一候选样本通过结构、事实、执行、重复、安全和人工等不同验证器，按任务风险决定接收、复核或拒绝。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">ONE CANDIDATE · MULTIPLE INDEPENDENT SIGNALS</text>
<rect x="440" y="75" width="320" height="72" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="600" y="109" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Candidate sample</text><text x="600" y="137" text-anchor="middle" font-size="13" fill="#536b75">Prompt + Response + Provenance</text>
<rect x="55" y="215" width="160" height="82" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="135" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Schema</text><text x="135" y="277" text-anchor="middle" font-size="13" fill="#536b75">字段 / 类型</text>
<rect x="250" y="215" width="160" height="82" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="330" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Factuality</text><text x="330" y="277" text-anchor="middle" font-size="13" fill="#536b75">Evidence / RAG</text>
<rect x="445" y="215" width="160" height="82" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="525" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Execution</text><text x="525" y="277" text-anchor="middle" font-size="13" fill="#536b75">Tests / Solver</text>
<rect x="640" y="215" width="160" height="82" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="720" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Novelty</text><text x="720" y="277" text-anchor="middle" font-size="13" fill="#536b75">Hash / MinHash</text>
<rect x="835" y="215" width="150" height="82" rx="14" fill="#f8eceb" stroke="#d8aaa4" stroke-width="2"/><text x="910" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Safety</text><text x="910" y="277" text-anchor="middle" font-size="13" fill="#536b75">PII / Policy</text>
<rect x="1020" y="215" width="130" height="82" rx="14" fill="#f4f0e5" stroke="#d6c69a" stroke-width="2"/><text x="1085" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Human</text><text x="1085" y="277" text-anchor="middle" font-size="13" fill="#536b75">Audit</text>
<path d="M600 147 L135 215" stroke="#8ba69e" stroke-width="2" fill="none"/><path d="M600 147 L330 215" stroke="#8ba69e" stroke-width="2" fill="none"/><path d="M600 147 L525 215" stroke="#8ba69e" stroke-width="2" fill="none"/><path d="M600 147 L720 215" stroke="#8ba69e" stroke-width="2" fill="none"/><path d="M600 147 L910 215" stroke="#8ba69e" stroke-width="2" fill="none"/><path d="M600 147 L1085 215" stroke="#8ba69e" stroke-width="2" fill="none"/>
<path d="M135 297 L135 350 L520 350 M330 297 L330 350 M525 297 L525 350 M720 297 L720 350 M910 297 L910 350 M1085 297 L1085 350" stroke="#8ba69e" stroke-width="2" fill="none"/>
<rect x="430" y="365" width="340" height="65" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="600" y="399" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Decision</text><text x="600" y="427" text-anchor="middle" font-size="13" fill="#536b75">Accept · Review · Reject</text>
<text x="600" y="447" text-anchor="middle" font-size="12" fill="#647b78">同一个模型自评不能替代独立证据；高风险任务应提高验证强度</text>
</g></svg>