<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s22path-title s22path-desc"><title id="s22path-title">领域与任务适配路径</title><desc id="s22path-desc">通用预训练模型先使用领域无标注语料做 DAPT，再用任务附近无标注语料做 TAPT，最后进行监督微调。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">GENERAL → DOMAIN → TASK → SUPERVISED</text>
<rect x="55" y="130" width="225" height="110" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="167.5" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Base pretraining</text><text x="167.5" y="192" text-anchor="middle" font-size="13" fill="#536b75">Broad multi-domain corpus</text>
<rect x="350" y="130" width="225" height="110" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="462.5" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">DAPT</text><text x="462.5" y="192" text-anchor="middle" font-size="13" fill="#536b75">Domain unlabeled text</text>
<rect x="645" y="130" width="225" height="110" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="757.5" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">TAPT</text><text x="757.5" y="192" text-anchor="middle" font-size="13" fill="#536b75">Task-adjacent unlabeled text</text>
<rect x="940" y="130" width="210" height="110" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="1045" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">SFT</text><text x="1045" y="192" text-anchor="middle" font-size="13" fill="#536b75">Labeled instructions / targets</text>
