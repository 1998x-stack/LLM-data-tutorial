<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s22data-title s22data-desc"><title id="s22data-title">领域语料治理</title><desc id="s22data-desc">领域数据从多个来源进入统一登记与质量治理，保留来源、版本、时间、许可和隐私元数据。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
