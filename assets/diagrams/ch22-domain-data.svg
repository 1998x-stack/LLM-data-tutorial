<rect x="405" y="180" width="265" height="125" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="537.5" y="214" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Source registry</text><text x="537.5" y="242" text-anchor="middle" font-size="13" fill="#536b75">Domain · Time · License\nProvenance · Parser version</text>
