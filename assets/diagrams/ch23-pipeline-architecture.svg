<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s23pipe-title s23pipe-desc"><title id="s23pipe-title">DataTrove Pipeline 与 Executor</title><desc id="s23pipe-desc">一组可组合的处理 block 形成 pipeline；Local、Slurm 和 Ray executor 负责执行而不改变数据变换逻辑。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">PIPELINE LOGIC ≠ EXECUTION ENVIRONMENT</text>
<rect x="45" y="120" width="170" height="90" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="130" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Reader</text><text x="130" y="182" text-anchor="middle" font-size="13" fill="#536b75">WARC / JSONL</text>
<rect x="255" y="120" width="170" height="90" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="340" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Extractor</text><text x="340" y="182" text-anchor="middle" font-size="13" fill="#536b75">HTML → text</text>
<rect x="465" y="120" width="170" height="90" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="550" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Filter</text><text x="550" y="182" text-anchor="middle" font-size="13" fill="#536b75">keep / drop</text>
<rect x="675" y="120" width="170" height="90" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="760" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Dedup / Stats</text><text x="760" y="182" text-anchor="middle" font-size="13" fill="#536b75">signatures / metrics</text>
<rect x="885" y="120" width="170" height="90" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="970" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Writer</text><text x="970" y="182" text-anchor="middle" font-size="13" fill="#536b75">sharded outputs</text>
<path d="M215 165 L243 165" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M238 158 L255 165 L238 172" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M425 165 L453 165" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M448 158 L465 165 L448 172" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 165 L663 165" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M658 158 L675 165 L658 172" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M845 165 L873 165" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M868 158 L885 165 L868 172" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M600 210 V275" stroke="#668b82" stroke-width="3"/>
<rect x="70" y="300" width="300" height="85" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="220" y="334" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Local Executor</text><text x="220" y="362" text-anchor="middle" font-size="13" fill="#536b75">multiprocessing · workers</text>
<rect x="450" y="300" width="300" height="85" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="600" y="334" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Slurm Executor</text><text x="600" y="362" text-anchor="middle" font-size="13" fill="#536b75">job arrays · dependencies</text>
<rect x="830" y="300" width="300" height="85" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="980" y="334" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Ray Executor</text><text x="980" y="362" text-anchor="middle" font-size="13" fill="#536b75">cluster task scheduling</text>
<text x="600" y="430" text-anchor="middle" font-size="13" fill="#647b78">相同 pipeline 可以在不同 executor 上运行</text>
</g></svg>