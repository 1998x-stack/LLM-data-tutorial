<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s23tasks-title s23tasks-desc"><title id="s23tasks-title">Task 与 Worker 分片</title><desc id="s23tasks-desc">输入文件分配给多个逻辑 task，worker 同时执行 task，完成后写入 completion marker 供失败恢复使用。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">FILES → TASK SHARDS → WORKERS → COMPLETION MARKERS</text>
<rect x="50" y="125" width="210" height="105" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="155" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Input files</text><text x="155" y="187" text-anchor="middle" font-size="13" fill="#536b75">F1 · F2 · F3 · ...</text>
<rect x="355" y="125" width="210" height="105" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="460" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Task shards</text><text x="460" y="187" text-anchor="middle" font-size="13" fill="#536b75">T0 · T1 · T2 · ...</text>
<rect x="660" y="125" width="210" height="105" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="765" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Workers</text><text x="765" y="187" text-anchor="middle" font-size="13" fill="#536b75">W0 · W1 · W2</text>
<rect x="965" y="125" width="185" height="105" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="1057.5" y="159" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Completions</text><text x="1057.5" y="187" text-anchor="middle" font-size="13" fill="#536b75">rank markers</text>
<path d="M260 178 L343 178" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M338 171 L355 178 L338 185" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M565 178 L648 178" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M643 171 L660 178 L643 185" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M870 178 L953 178" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M948 171 L965 178 L948 185" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M760 230 L760 310 L450 310 L450 230" fill="none" stroke="#9a7db2" stroke-width="2" stroke-dasharray="7 6"/>
<text x="605" y="344" text-anchor="middle" font-size="17" font-weight="800" fill="#715b87">Retry only incomplete tasks</text>
<text x="605" y="375" text-anchor="middle" font-size="13" fill="#647b78">重跑时保持相同输入清单与 tasks 数，避免分片映射变化</text>
<text x="605" y="420" text-anchor="middle" font-size="13" fill="#9a6258">tasks 大于 files 时会出现空任务；workers 大于可运行任务也不会提升吞吐</text>
</g></svg>