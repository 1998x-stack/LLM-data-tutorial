<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s24eco-title s24eco-desc"><title id="s24eco-title">Dolma Dataset、Toolkit 与 Dolma 3</title><desc id="s24eco-desc">原始 Dolma Dataset 是训练语料，Dolma Toolkit 是整理工具；Dolma 3 是 OLMo 3 数据集与重建配方家族。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">THREE RELATED BUT DISTINCT ARTIFACTS</text>
<rect x="65" y="120" width="315" height="145" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="222.5" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Dolma Dataset</text><text x="222.5" y="182" text-anchor="middle" font-size="13" fill="#536b75">~3T-token open English corpus\nweb · papers · code · books</text>
<rect x="445" y="120" width="315" height="145" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="602.5" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Dolma Toolkit</text><text x="602.5" y="182" text-anchor="middle" font-size="13" fill="#536b75">tag · dedupe · mix · stat · tokens</text>
<rect x="825" y="120" width="315" height="145" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="982.5" y="154" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Dolma 3</text><text x="982.5" y="182" text-anchor="middle" font-size="13" fill="#536b75">5.9T pretrain · 100B midtrain\n50B long-context recipes</text>
<path d="M380 192 L445 192" stroke="#668b82" stroke-width="3"/><path d="M760 192 L825 192" stroke="#668b82" stroke-width="3"/>
<text x="412" y="175" text-anchor="middle" font-size="12" fill="#56716c">curation</text>
<text x="792" y="175" text-anchor="middle" font-size="12" fill="#56716c">evolved data family</text>
<text x="600" y="340" text-anchor="middle" font-size="18" font-weight="800" fill="#315b55">Dataset ≠ Toolkit ≠ Reconstruction recipe</text>
<text x="600" y="375" text-anchor="middle" font-size="13" fill="#647b78">确认版本、数据卡、license 与 CLI 所属仓库再复现</text>
