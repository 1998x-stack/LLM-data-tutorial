<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s24flow-title s24flow-desc"><title id="s24flow-title">Dolma Toolkit 四步整理流程</title><desc id="s24flow-desc">Taggers 生成属性，dedupe 标记重复，mixer 按属性过滤和混合，tokens 将文档转换为 token IDs。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">TAG → DEDUPE → MIX → TOKENIZE</text>
<rect x="60" y="135" width="235" height="105" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="177.5" y="169" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">1 · Taggers</text><text x="177.5" y="197" text-anchor="middle" font-size="13" fill="#536b75">language · toxicity · length</text>
<rect x="350" y="135" width="235" height="105" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="467.5" y="169" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">2 · Dedupe</text><text x="467.5" y="197" text-anchor="middle" font-size="13" fill="#536b75">document / paragraph flags</text>
<rect x="640" y="135" width="235" height="105" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="757.5" y="169" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">3 · Mixer</text><text x="757.5" y="197" text-anchor="middle" font-size="13" fill="#536b75">include / exclude / spans</text>
<rect x="930" y="135" width="215" height="105" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="1037.5" y="169" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">4 · Tokens</text><text x="1037.5" y="197" text-anchor="middle" font-size="13" fill="#536b75">token IDs + index CSV</text>
<path d="M295 187 L338 187" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M333 180 L350 187 L333 194" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 187 L628 187" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M623 180 L640 187 L623 194" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M875 187 L918 187" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M913 180 L930 187 L913 194" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M177 240 L177 305 L757 305 L757 240" fill="none" stroke="#9a7db2" stroke-width="2" stroke-dasharray="7 6"/>
<text x="470" y="340" text-anchor="middle" font-size="14" fill="#715b87">Attributes are sidecars: keep original documents available for re-mixing</text>
<text x="600" y="410" text-anchor="middle" font-size="13" fill="#647b78">Tag first, decide later: auditable attributes separate measurement from deletion</text>
</g></svg>