<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s25gates-title s25gates-desc"><title id="s25gates-title">硬治理门与质量筛选分层</title><desc id="s25gates-desc">来源权利、隐私、安全和评测去污染是不能被质量分抵消的硬门；通过后再组合过滤和下游验证。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">GOVERNANCE GATES BEFORE QUALITY OPTIMIZATION</text>
<rect x="65" y="105" width="245" height="115" rx="14" fill="#f8eceb" stroke="#d8aaa4" stroke-width="2"/><text x="187.5" y="139" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Hard gates</text><text x="187.5" y="167" text-anchor="middle" font-size="13" fill="#536b75">license · privacy · safety\nprovenance · decontamination</text>
<rect x="385" y="105" width="245" height="115" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="507.5" y="139" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Low-cost filters</text><text x="507.5" y="167" text-anchor="middle" font-size="13" fill="#536b75">parse · language · rules\nexact dedup</text>
<rect x="705" y="105" width="245" height="115" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="827.5" y="139" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Quality selection</text><text x="827.5" y="167" text-anchor="middle" font-size="13" fill="#536b75">PPL · classifier · LLM\nstratified review</text>
<rect x="955" y="280" width="190" height="100" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="1050" y="314" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Acceptance</text><text x="1050" y="342" text-anchor="middle" font-size="13" fill="#536b75">versioned corpus\nwith audit trail</text>
<path d="M310 162 L373 162" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M368 155 L385 162 L368 169" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 162 L693 162" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round"/><path d="M688 155 L705 162 L688 169" fill="none" stroke="#668b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M827 220 L827 330 L955 330" stroke="#668b82" stroke-width="3" fill="none"/><path d="M940 318 L955 330 L940 342" stroke="#668b82" stroke-width="3" fill="none"/>
<rect x="80" y="285" width="330" height="95" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="245" y="319" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">Human + downstream</text><text x="245" y="347" text-anchor="middle" font-size="13" fill="#536b75">blind audit · fixed recipe · ablation</text>
<path d="M827 220 L827 270 L410 270 L410 332" stroke="#9a7db2" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
<text x="600" y="420" text-anchor="middle" font-size="13" fill="#647b78">治理约束是 eligibility gate，不应与质量分数做抵消式平均</text>
</g></svg>