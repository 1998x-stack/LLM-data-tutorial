<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="s25six-title s25six-desc"><title id="s25six-title">六大清洗范式</title><desc id="s25six-desc">规则、统计、去重、监督分类器、LLM 语义评估、人工与下游实验提供不同证据，互相补充。</desc><rect width="1200" height="460" rx="22" fill="#f7faf9" stroke="#d9e5e0"/><g font-family="Inter,Arial,'Microsoft YaHei',sans-serif">
<text x="48" y="46" font-size="15" font-weight="700" fill="#56716c">SIX EVIDENCE FAMILIES FOR DATA CURATION</text>
<rect x="65" y="100" width="315" height="105" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="222.5" y="134" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">01 · Rules</text><text x="222.5" y="162" text-anchor="middle" font-size="13" fill="#536b75">cheap · deterministic · interpretable</text>
<rect x="440" y="100" width="315" height="105" rx="14" fill="#e8f4ee" stroke="#a3c9b4" stroke-width="2"/><text x="597.5" y="134" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">02 · Statistics</text><text x="597.5" y="162" text-anchor="middle" font-size="13" fill="#536b75">language model · distribution score</text>
<rect x="815" y="100" width="315" height="105" rx="14" fill="#fff0df" stroke="#e3c28d" stroke-width="2"/><text x="972.5" y="134" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">03 · Dedup</text><text x="972.5" y="162" text-anchor="middle" font-size="13" fill="#536b75">hash · MinHash · similarity</text>
<rect x="65" y="255" width="315" height="105" rx="14" fill="#f3ecfa" stroke="#c1abd8" stroke-width="2"/><text x="222.5" y="289" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">04 · Classifiers</text><text x="222.5" y="317" text-anchor="middle" font-size="13" fill="#536b75">supervised quality / safety models</text>
<rect x="440" y="255" width="315" height="105" rx="14" fill="#eaf2f8" stroke="#9bb7c8" stroke-width="2"/><text x="597.5" y="289" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">05 · LLM Judge</text><text x="597.5" y="317" text-anchor="middle" font-size="13" fill="#536b75">rubric · evidence · semantic checks</text>
<rect x="815" y="255" width="315" height="105" rx="14" fill="#f8eceb" stroke="#d8aaa4" stroke-width="2"/><text x="972.5" y="289" text-anchor="middle" font-size="19" font-weight="800" fill="#24465b">06 · Human + Utility</text><text x="972.5" y="317" text-anchor="middle" font-size="13" fill="#536b75">audit · ablation · downstream eval</text>
<text x="600" y="420" text-anchor="middle" font-size="13" fill="#647b78">方法不是排行榜：先识别噪声类型，再选择适合的证据与成本</text>
</g></svg>