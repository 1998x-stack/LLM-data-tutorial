<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="c26agent-title c26agent-desc"><title id="c26agent-title">规划平面与授权控制面分离</title><desc id="c26agent-desc">不可信数据与自然语言目标进入只读规划器；生成候选仅在沙箱执行，验证和批准后才可以晋级生产。</desc><rect x="0" y="0" width="1200" height="480" rx="24" fill="#f7faf9"/><g font-family="Arial,'Microsoft YaHei',sans-serif">
