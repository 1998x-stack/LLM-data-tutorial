<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="c27feedback-title c27feedback-desc"><title id="c27feedback-title">反馈闭环中的不可变评测与探索底座</title><desc id="c27feedback-desc">Sampler 输出训练批次，模型训练后在独立固定验证窗口观察反馈，控制器受探索比例限制更新下一阶段采样权重并记录日志。</desc><rect width="1200" height="480" rx="24" fill="#f7faf9"/><g font-family="Arial,'Microsoft YaHei',sans-serif">
<text x="600" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#668980">TARGET TRAINING · CONTROLLED FEEDBACK</text>
