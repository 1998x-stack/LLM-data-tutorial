<rect x="645" y="150" width="240" height="106" rx="16" fill="#ebe7f8" stroke="#b6a4d8" stroke-width="2"/><text x="765" y="184" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Eval window</text><text x="765" y="211" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">frozen held-out slice</text>
<rect x="940" y="150" width="215" height="106" rx="16" fill="#dff0e7" stroke="#96c0aa" stroke-width="2"/><text x="1047.5" y="184" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Controller</text><text x="1047.5" y="211" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">latency-aware update</text>
