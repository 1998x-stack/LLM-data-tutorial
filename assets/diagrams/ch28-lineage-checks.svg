<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="c28lineage-title c28lineage-desc"><title id="c28lineage-title">运行身份与产物哈希复核</title><desc id="c28lineage-desc">原始输入字节、规范化政策和代码版本共同决定运行身份；输出 curated、rejected、report 的内容校验和记录到 manifest 中供后续复核。</desc><rect width="1200" height="480" rx="24" fill="#f7faf9"/><g font-family="Arial,'Microsoft YaHei',sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#668980">INPUT IDENTITY ≠ OUTPUT INTEGRITY ≠ DATA CORRECTNESS</text>
<rect x="45" y="110" width="285" height="96" rx="16" fill="#e3eff7" stroke="#96b8c8" stroke-width="2"/><text x="187.5" y="144" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Raw input bytes</text><text x="187.5" y="171" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">SHA-256 digest</text>
<rect x="45" y="228" width="285" height="96" rx="16" fill="#fff0df" stroke="#d9be8d" stroke-width="2"/><text x="187.5" y="262" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Canonical policy</text><text x="187.5" y="289" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">SHA-256 digest</text>
<rect x="45" y="346" width="285" height="96" rx="16" fill="#ebe7f8" stroke="#b6a4d8" stroke-width="2"/><text x="187.5" y="380" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Code version</text><text x="187.5" y="407" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">capstone-v1.0</text>
<rect x="430" y="200" width="300" height="130" rx="16" fill="#dff0e7" stroke="#96c0aa" stroke-width="2"/><text x="580" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Deterministic run ID</text><text x="580" y="261" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">SHA-256 of canonical tuple</text>
<path d="M330 158 L430 231 M330 276 L430 265 M330 395 L430 301" stroke="#6d8c84" stroke-width="3" fill="none"/>
<path d="M730 265 L816 265" stroke="#6d8c84" stroke-width="3" fill="none"/><path d="M805 258 L816 265 L805 272" stroke="#6d8c84" stroke-width="3" fill="none"/>
<rect x="816" y="200" width="340" height="130" rx="16" fill="#e3eff7" stroke="#96b8c8" stroke-width="2"/><text x="986" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#294d55">Manifest + verify</text><text x="986" y="261" text-anchor="middle" font-size="13" font-weight="400" fill="#617e86">curated / rejected / report hashes</text>
<text x="980" y="363" text-anchor="middle" font-size="15" font-weight="700" fill="#a06b60">Corrupted bytes → FAIL</text>
<text x="600" y="467" text-anchor="middle" font-size="13" font-weight="500" fill="#607b75">哈希证明字节身份与一致性；它并不能证明数据真实、无偏差或许可有效</text>
</g></svg>